<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Result Generator</title>
</head>
<body>
  <h2>Game Result Generator</h2>
  <button onclick="showGameResult()">Show Result</button>
  <p id="result"></p>

  <script>
    function showGameResult() {
      let mysteryLevel = Math.floor(Math.random() * 50) + 1;
      let userScore = "45";
      let scoreNumber = Number(userScore);
      let difference = Math.abs(mysteryLevel - scoreNumber);
      let sqrtScore = Math.sqrt(scoreNumber);
      let piValue = Math.PI;
      let implicitValue = "20" * 5;
      let highest = Math.max(10, 20, mysteryLevel);
      let lowest = Math.min(10, 20, mysteryLevel);

      document.getElementById("result").innerHTML =
        "Mystery Level: " + mysteryLevel + "<br>" +
        "Difference: " + difference + "<br>" +
        "Square Root: " + sqrtScore + "<br>" +
        "Pi: " + piValue + "<br>" +
        "Implicit Conversion: " + implicitValue + "<br>" +
        "Highest: " + highest + "<br>" +
        "Lowest: " + lowest;
    }
  </script>
</body>
</html>
