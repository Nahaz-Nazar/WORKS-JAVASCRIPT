<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Page</title>
</head>
<body>
  <h2>Profile Page</h2>
  <button onclick="checkAccess()">Check Access</button>
  <p id="result"></p>

  <script>
    let user = {
      name: "Asha",
      age: 20,
      isAdmin: true
    };

    function checkAccess() {
      let access = (user.age >= 18 && user.isAdmin) ? "Access Granted" : "Access Denied";

      if ("age" in user) {
        delete user.age;
      }

      document.getElementById("result").innerText = access;
    }
  </script>
</body>
</html>
