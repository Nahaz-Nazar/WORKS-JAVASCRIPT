<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIRTHDAY TRACKER</title>
</head>
<body>
    <script>
        const friend = {
            name: "John",
            birthDate: "1999-07-05"
        };

        function getBirthdayDetails(friend) {
            const birth = new Date(friend.birthDate);
            const today = new Date();

            const year = birth.getFullYear();
            const month = birth.toLocaleString("en", { month: "long" });
            const day = birth.getDate();

            let age = today.getFullYear() - birth.getFullYear();
            const monthDiff = today.getMonth() - birth.getMonth();

            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) {
                age--;
            }

            console.log(`${friend.name} was born on ${day} ${month}, ${year} and is ${age} years old.`);
        }

        getBirthdayDetails(friend);
    </script>
</body>
</html>
