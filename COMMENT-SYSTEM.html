<body>
    <script>
        function replaceNumbers(comment) {
  const found = /\d/.test(comment);  
  const updatedComment = comment.replace(/\d/g, "NUMBER"); 

  return {
    found: found,
    updatedComment: updatedComment
  };
}

const comment = "My son is 12 years old. Our flat number is 45 and contact is 9876543210.";

const result = replaceNumbers(comment);
console.log(result);
    </script>
</body>
